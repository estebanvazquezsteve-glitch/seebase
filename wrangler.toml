name = "seebase"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "INDEX"
class_name = "BoardIndex"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BoardRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardIndex", "BoardRoom"]
